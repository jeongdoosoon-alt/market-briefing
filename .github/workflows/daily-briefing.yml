name: 미국 시황 브리핑

on:
  schedule:
    # UTC 22:00 = 한국시간 오전 7시. 월~금(UTC) = 한국 화~토 아침 (미국 장 마감 다음 날)
    - cron: "0 22 * * 1-5"
  workflow_dispatch: # GitHub 화면에서 수동 실행 버튼

permissions:
  contents: write # 브리핑 페이지(docs/)를 커밋하기 위해 필요

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: run
        run: python briefing.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          BRIEFING_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      # 브리핑 페이지를 저장소에 올리면 GitHub Pages가 자동으로 갱신된다
      - name: 브리핑 페이지 게시
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "브리핑 $(TZ=Asia/Seoul date +%F)"
          git push

      # 카카오가 새 리프레시 토큰을 주면 Secret을 자동 갱신 (약 2개월마다)
      - if: steps.run.outputs.new_refresh_token != ''
        run: gh secret set KAKAO_REFRESH_TOKEN --body "${{ steps.run.outputs.new_refresh_token }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
